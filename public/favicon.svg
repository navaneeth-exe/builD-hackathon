<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#174C3C"/>
      <stop offset="100%" stop-color="#0E2F25"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9FA78"/>
      <stop offset="100%" stop-color="#A6DD3B"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Iconic 'P' + Parking Bay Design -->
  <!-- Modern Geometric 'P' in Vibrant Lime -->
  <path d="M20 48V16H33.5C39.299 16 44 20.701 44 26.5C44 32.299 39.299 37 33.5 37H28V48H20Z" fill="url(#limeGrad)" filter="url(#glow)"/>
  
  <!-- Inner counter of 'P' cutout -->
  <path d="M28 23V30H33.5C35.433 30 37 28.433 37 26.5C37 24.567 35.433 23 33.5 23H28Z" fill="#174C3C"/>

  <!-- Smart Sync / Sensor dot (signal accent) -->
  <circle cx="44" cy="44" r="5" fill="#D9FA78"/>
  <circle cx="44" cy="44" r="9" stroke="#D9FA78" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>